<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0d0f17"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#bfe3ff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#7fb8ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7fb8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4e6cf"/>
      <stop offset="1" stop-color="#d9a46b"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <!-- the loop: a circle that almost closes -->
  <path d="M 172.1 74.6 A 70 70 0 1 0 197.4 136.9" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round"/>
  <!-- the phone glow where the loop fails to close -->
